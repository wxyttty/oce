[package]
name = "oce-infra"
description = "OpenContextEngine infrastructure: TriviumDB store, SQLite admin store, OpenAI-compatible clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oce-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
triviumdb = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
model2vec-rs = "0.2.1"
rayon = { workspace = true }
hf-hub = { workspace = true }
safetensors = "0.8"
sysinfo = { workspace = true }
libc = "0.2"
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = "0.23"

[features]
default = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
metal = ["candle-core/metal", "candle-nn/metal"]
