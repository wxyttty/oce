[package]
name = "oce-server"
description = "OpenContextEngine HTTP server (ACE-compatible API)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "oce_server"
path = "src/lib.rs"

[[bin]]
name = "oce"
path = "src/main.rs"

[dependencies]
